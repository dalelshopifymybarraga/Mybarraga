<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYBARRAGA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#0d0d0d; --paper:#fdfcf9; --line:#e6e3db;
  --accent:#8f0f1d; --muted:#7a7568;
  --serif:'Cormorant Garamond',serif; --sans:'Jost',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:inherit;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}

/* ---------- SPLASH ---------- */
#splash{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px;z-index:100;cursor:pointer;transition:opacity 1s ease;}
#splash.hide{opacity:0;pointer-events:none;}
#logoDark{width:min(62vw,420px);opacity:0;animation:logoFade 1.8s ease forwards .3s;}
@keyframes logoFade{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
#clocks{display:flex;gap:46px;font-family:var(--sans);opacity:0;animation:riseIn 1s ease forwards 1.4s;}
@keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.clockrow{text-align:center;}
.clockrow .loc{display:block;font-size:11px;letter-spacing:.22em;color:#9a9a9a;margin-bottom:6px;}
.clockrow .time{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.05em;}
#enterHint{font-size:12px;letter-spacing:.2em;color:#8a8a8a;opacity:0;animation:pulse 2.6s ease-in-out infinite 2.4s;}
@keyframes pulse{0%,100%{opacity:.35;}50%{opacity:.9;}}

/* ---------- SITE SHELL ---------- */
#site{opacity:0;transition:opacity 1.1s ease;}
#site.show{opacity:1;}
header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(18px,4vw,48px);border-bottom:1px solid var(--line);}
.brand img{height:26px;width:auto;opacity:0;transform:translateY(6px);animation:brandIn .8s ease forwards;}
@keyframes brandIn{to{opacity:1;transform:translateY(0);}}
#mainNav{display:flex;gap:clamp(16px,3vw,34px);}
#mainNav a{font-size:13px;letter-spacing:.14em;padding:6px 2px;border-bottom:1px solid transparent;transition:border-color .25s ease,opacity .25s ease;}
#mainNav a:hover{border-color:var(--ink);}
#mainNav a.active{border-color:var(--accent);color:var(--accent);}

main{min-height:70vh;}
.page{animation:pageIn .5s ease;}
@keyframes pageIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

footer{border-top:1px solid var(--line);padding:34px clamp(18px,4vw,48px) 44px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;}
.social{display:flex;gap:22px;}
.social a{font-size:12px;letter-spacing:.14em;color:var(--muted);}
.social a:hover{color:var(--ink);}
footer p{font-size:11px;color:var(--muted);margin:0;}

/* ---------- HOME ---------- */
.hero{padding:min(14vh,110px) clamp(18px,6vw,60px) 70px;text-align:center;border-bottom:1px solid var(--line);}
.hero .eyebrow{font-size:12px;letter-spacing:.3em;color:var(--accent);margin-bottom:22px;}
.hero h1{font-family:var(--serif);font-weight:500;font-style:italic;font-size:clamp(36px,7vw,88px);line-height:1.05;margin:0 auto 26px;max-width:15ch;}
.hero p{max-width:46ch;margin:0 auto 34px;color:var(--muted);font-size:15px;line-height:1.7;}
.btn{display:inline-block;border:1px solid var(--ink);padding:14px 34px;font-size:12px;letter-spacing:.18em;transition:background .25s ease,color .25s ease;}
.btn:hover{background:var(--ink);color:#fff;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1px;background:var(--line);}
.card{background:var(--paper);padding:28px 24px 24px;position:relative;}
.card .swatch{aspect-ratio:3/4;margin-bottom:18px;position:relative;overflow:hidden;}
.card .swatch::after{content:'';position:absolute;inset:0;transition:transform .6s ease;}
.card:hover .swatch::after{transform:scale(1.05);}
.card h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 6px;}
.card .price{font-size:13px;color:var(--muted);margin-bottom:14px;}
.card-actions{display:flex;justify-content:space-between;align-items:center;}
.share-btn{font-size:11px;letter-spacing:.14em;border:1px solid var(--line);padding:8px 14px;transition:border-color .2s ease;}
.share-btn:hover{border-color:var(--ink);}

section.block{padding:70px clamp(18px,6vw,60px);}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:34px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(26px,4vw,42px);margin:0;}
.section-head .tag{font-size:11px;letter-spacing:.2em;color:var(--muted);}

/* ---------- CATALOGUE / BOOK ---------- */
.cat-wrap{padding:60px clamp(18px,5vw,50px) 90px;display:flex;flex-direction:column;align-items:center;}
.cat-wrap .section-head{width:100%;max-width:760px;}
.book{position:relative;width:min(760px,94vw);height:min(500px,62vw);perspective:2400px;margin-top:20px;}
.page-static,.page-flip{position:absolute;top:0;width:50%;height:100%;background:var(--paper);border:1px solid var(--line);overflow:hidden;}
.page-static{padding:30px 26px;}
.page-static.left{left:0;border-right:none;}
.page-static.right{right:0;border-left:none;}
.page-static .cap{font-size:10px;letter-spacing:.2em;color:var(--accent);margin-bottom:10px;}
.page-static h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(20px,3vw,30px);margin:0 0 10px;}
.page-static p{font-size:13px;line-height:1.75;color:var(--muted);margin:0;}
.page-static .pnum{position:absolute;bottom:14px;font-size:10px;color:var(--muted);letter-spacing:.1em;}
.page-static.left .pnum{left:26px;}
.page-static.right .pnum{right:26px;}
.page-flip{transform-style:preserve-3d;transition:transform .95s cubic-bezier(.45,.05,.2,1);z-index:5;}
.page-flip.right-origin{right:0;transform-origin:left center;}
.page-flip.left-origin{left:0;transform-origin:right center;}
.page-flip .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);padding:30px 26px;}
.page-flip .face.back{transform:rotateY(180deg);}
.page-flip .face .cap{font-size:10px;letter-spacing:.2em;color:var(--accent);margin-bottom:10px;}
.page-flip .face h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(20px,3vw,30px);margin:0 0 10px;}
.page-flip .face p{font-size:13px;line-height:1.75;color:var(--muted);margin:0;}
.book-shadow{position:absolute;left:50%;top:0;width:1px;height:100%;background:var(--line);z-index:1;}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:50%;z-index:8;transition:border-color .2s ease;}
.nav-arrow:hover{border-color:var(--ink);}
.nav-arrow.prev{left:-52px;}
.nav-arrow.next{right:-52px;}
@media(max-width:820px){.nav-arrow.prev{left:-4px;}.nav-arrow.next{right:-4px;}}
.page-indicator{margin-top:20px;font-size:11px;letter-spacing:.16em;color:var(--muted);}

/* ---------- JOURNAL / CONTACT ---------- */
.journal-list{display:flex;flex-direction:column;max-width:760px;margin:0 auto;}
.journal-item{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 0;border-bottom:1px solid var(--line);}
.journal-item h3{font-family:var(--serif);font-weight:500;font-style:italic;font-size:22px;margin:0 0 6px;}
.journal-item p{margin:0;color:var(--muted);font-size:13px;}
.contact-wrap{max-width:520px;margin:0 auto;text-align:center;}
.contact-wrap p{color:var(--muted);line-height:1.8;}
.field{width:100%;padding:14px 0;border:none;border-bottom:1px solid var(--line);margin-bottom:22px;font-family:var(--sans);font-size:14px;background:transparent;outline:none;transition:border-color .2s ease;}
.field:focus{border-color:var(--ink);}

/* ---------- SHARE MENU ---------- */
#shareMenu{position:fixed;background:#fff;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.12);padding:10px;display:none;z-index:60;min-width:170px;}
#shareMenu.open{display:block;}
#shareMenu a,#shareMenu button{display:block;width:100%;text-align:left;padding:9px 10px;font-size:12.5px;letter-spacing:.04em;}
#shareMenu a:hover,#shareMenu button:hover{background:var(--paper);}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important;}}
</style>
</head>

/* ========== SPLASH + CLOCK ========== */
function pad(n){return n.toString().padStart(2,'0');}
function tick(){
  const now = new Date();
  const t = new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Tunis',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
  const g = new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
  document.getElementById('clockTunis').textContent = t;
  document.getElementById('clockGmt').textContent = g;
}

/* ========== SHARE ========== */
const shareMenu = document.getElementById('shareMenu');
function closeShare(){shareMenu.classList.remove('open');}
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.share-btn') && !e.target.closest('#shareMenu')) closeShare();
});
function shareItem(e, title){
  e.stopPropagation();
  const url = location.href.split('#')[0] + '#/shop/' + encodeURIComponent(title);
  const text = title + ' \u2014 MYBARRAGA';
  if(navigator.share){ navigator.share({title:text,url}).catch(()=>{}); return; }
  const rect = e.currentTarget.getBoundingClientRect();
  shareMenu.style.top = (rect.bottom + window.scrollY + 6) + 'px';
  shareMenu.style.left = Math.max(10, rect.left - 40) + 'px';
  shareMenu.innerHTML = `
    <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}" target="_blank" rel="noopener">Share on X</a>
    <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank" rel="noopener">Share on Facebook</a>
    <a href="https://wa.me/?text=${encodeURIComponent(text+' '+url)}" target="_blank" rel="noopener">Share on WhatsApp</a>
    <a href="https://pinterest.com/pin/create/button/?url=${encodeURIComponent(url)}&description=${encodeURIComponent(text)}" target="_blank" rel="noopener">Share on Pinterest</a>
    <button onclick="navigator.clipboard.writeText('${url}');this.textContent='Link copied';">Copy link</button>
  `;
  shareMenu.classList.add('open');
}

}

    <div class="grid">${PRODUCTS.slice(0,3).map(productCard).join('')}</div>
  </section>
  <section class="block" style="border-top:1px solid var(--line);">
    <div class="section-head"><h2>The Cahier</h2><span class="tag">FLIP THROUGH THE CATALOGUE</span></div>
    <p style="max-width:52ch;color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:26px;">A paper record of the house, rendered for the screen. Turn the pages like the real thing.</p>
    <a class="btn" href="#/catalogue">Open Catalogue</a>
  </section>`;
}

function renderShop(){
  return `<section class="block">
    <div class="section-head"><h2>Shop</h2><span class="tag">${PRODUCTS.length} PIECES</span></div>
    <div class="grid">${PRODUCTS.map(productCard).join('')}</div>

function renderJournal(){
  return `<section class="block">
    <div class="section-head"><h2>Journal</h2><span class="tag">FROM THE STUDIO</span></div>
    <div class="journal-list">${JOURNAL.map(j=>`
      <div class="journal-item">

function renderContact(){
  return `<section class="block">

      <p>Studio &amp; showroom \u2014 Tunis, Tunisia. By appointment.<br>hello@mybarraga.com</p>
      <form onsubmit="event.preventDefault();this.querySelector('.btn').textContent='Sent';">

        <button class="btn" type="submit">Send</button>

/* ========== CATALOGUE / FLIPBOOK ========== */
let spreadIndex = 0;
function renderCatalogue(){
  setTimeout(initBook,0);
  return `<div class="cat-wrap">
    <div class="section-head"><h2>Catalogue</h2><span class="tag">CLICK OR SWIPE TO TURN</span></div>
    <div class="book" id="book">
      <div class="page-static left" id="statLeft"></div>
      <div class="page-static right" id="statRight"></div>
      <div class="book-shadow"></div>
      <button class="nav-arrow prev" id="prevPage">\u2039</button>
      <button class="nav-arrow next" id="nextPage">\u203a</button>
    </div>
    <div class="page-indicator" id="pageIndicator"></div>
  </div>`;
}

function spreadFace(p){
  if(!p) return '';
  return `<div class="cap">${p.cap}</div><h3>${p.title}</h3><p>${p.body}</p>`;
}

function paintStatic(){
  document.getElementById('statLeft').innerHTML = spreadFace(SPREADS[spreadIndex][0]) + `<span class="pnum">${spreadIndex*2+1}</span>`;
  document.getElementById('statRight').innerHTML = spreadFace(SPREADS[spreadIndex][1]) + `<span class="pnum">${spreadIndex*2+2}</span>`;
  document.getElementById('pageIndicator').textContent = `SPREAD ${spreadIndex+1} / ${SPREADS.length}`;
  document.getElementById('prevPage').style.visibility = spreadIndex===0 ? 'hidden' : 'visible';
  document.getElementById('nextPage').style.visibility = spreadIndex===SPREADS.length-1 ? 'hidden' : 'visible';
}

function flip(dir){
  const book = document.getElementById('book');
  if(book.querySelector('.page-flip')) return;
  const canGo = dir==='next' ? spreadIndex < SPREADS.length-1 : spreadIndex > 0;
  if(!canGo) return;
  const el = document.createElement('div');
  el.className = 'page-flip ' + (dir==='next' ? 'right-origin' : 'left-origin');
  const frontContent = dir==='next' ? SPREADS[spreadIndex][1] : SPREADS[spreadIndex][0];
  const nextIdx = dir==='next' ? spreadIndex+1 : spreadIndex-1;
  const backContent = dir==='next' ? SPREADS[nextIdx][0] : SPREADS[nextIdx][1];
  el.innerHTML = `<div class="face front">${spreadFace(frontContent)}</div><div class="face back">${spreadFace(backContent)}</div>`;
  book.appendChild(el);
  if(dir==='next'){ document.getElementById('statRight').style.visibility='hidden'; }
  else { document.getElementById('statLeft').style.visibility='hidden'; }
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{ el.style.transform = dir==='next' ? 'rotateY(-180deg)' : 'rotateY(180deg)'; });
  });
  el.addEventListener('transitionend', ()=>{
    spreadIndex = nextIdx;
    document.getElementById('statRight').style.visibility='visible';
    document.getElementById('statLeft').style.visibility='visible';
    paintStatic();
    el.remove();
  }, {once:true});
}

function initBook(){
  paintStatic();
  document.getElementById('nextPage').onclick = ()=>flip('next');
  document.getElementById('prevPage').onclick = ()=>flip('prev');
  const book = document.getElementById('book');
  let sx = null;
  book.addEventListener('touchstart', e=>{ sx = e.touches[0].clientX; }, {passive:true});
  book.addEventListener('touchend', e=>{
    if(sx===null) return;
    const dx = e.changedTouches[0].clientX - sx;
    if(Math.abs(dx) > 40) flip(dx < 0 ? 'next' : 'prev');
    sx = null;
  }, {passive:true});
  book.addEventListener('click', e=>{
    if(e.target.closest('.nav-arrow')) return;
    const rect = book.getBoundingClientRect();
    const half = e.clientX - rect.left > rect.width/2 ? 'next' : 'prev';
    flip(half);
  });
}

/* ========== ROUTER ========== */
const ROUTES = {home:renderHome, shop:renderShop, catalogue:renderCatalogue, journal:renderJournal, contact:renderContact};
function router(){
  const hash = location.hash.replace('#/','').split('/')[0] || 'home';
  const route = ROUTES[hash] ? hash : 'home';
  document.getElementById('main').innerHTML = `<div class="page">${ROUTES[route]()}</div>`;
  document.querySelectorAll('[data-route-link]').forEach(a=>{
    a.classList.toggle('active', a.dataset.routeLink === route);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
</script>
